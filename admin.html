<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - CCTV Enquiries</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        /* LOGIN */

        #loginBox {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        #loginBox h2 {
            margin-bottom: 20px;
        }

        #loginBox input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #loginBox button {
            width: 97%;
            padding: 12px;
            margin-top: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #loginBox button:hover {
            background: #444;
        }

        #loginError {
            color: red;
        }

        /* ADMIN */

        #adminContent {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .logout-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        /* DASHBOARD CARDS */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
            font-size: 16px;
        }

        .card p {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
        }

        /* TABLE */

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        select {
            padding: 7px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

    <h2>Admin Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="adminLogin()">
        Login
    </button>

    <p id="loginError"></p>

</div>


<!-- ADMIN CONTENT -->

<div id="adminContent">

    <div class="top-bar">

        <h1>CCTV Admin Dashboard</h1>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="card">
            <h3>Total Enquiries</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <p id="pendingCount">0</p>
        </div>

        <div class="card">
            <h3>Contacted</h3>
            <p id="contactedCount">0</p>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <p id="completedCount">0</p>
        </div>

    </div>


    <!-- ENQUIRY TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Service</th>
                    <th>Message</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="enquiryTable"></tbody>

        </table>

    </div>

</div>


<script>


/* ADMIN LOGIN */

function adminLogin() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    fetch("http://localhost:8080/api/admin/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            username: username,
            password: password

        })

    })

    .then(response => response.text())

    .then(data => {

        if (data === "Login successful") {

            document.getElementById("loginBox").style.display = "none";

            document.getElementById("adminContent").style.display = "block";

            loadEnquiries();

        } else {

            document.getElementById("loginError").innerText =
                "Invalid username or password";

        }

    })

    .catch(error => {

        console.error("Error:", error);

        document.getElementById("loginError").innerText =
            "Server connection failed";

    });

}


/* LOAD ENQUIRIES */

function loadEnquiries() {

    fetch("http://localhost:8080/api/enquiries")

        .then(response => response.json())

        .then(data => {

            const table =
                document.getElementById("enquiryTable");

            table.innerHTML = "";


            /* COUNTS */

            let pending = 0;
            let contacted = 0;
            let completed = 0;


            data.forEach(enquiry => {

                if (enquiry.status === "PENDING") {
                    pending++;
                }

                if (enquiry.status === "CONTACTED") {
                    contacted++;
                }

                if (enquiry.status === "COMPLETED") {
                    completed++;
                }


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${enquiry.id}</td>

                    <td>${enquiry.name}</td>

                    <td>${enquiry.phone}</td>

                    <td>${enquiry.email || ""}</td>

                    <td>${enquiry.service}</td>

                    <td>${enquiry.message || ""}</td>

                    <td>${enquiry.createdAt || ""}</td>

                    <td>

                        <select
                            onchange="updateStatus(
                                ${enquiry.id},
                                this.value
                            )"
                        >

                            <option value="PENDING"
                                ${enquiry.status === "PENDING"
                                    ? "selected"
                                    : ""}>
                                PENDING
                            </option>

                            <option value="CONTACTED"
                                ${enquiry.status === "CONTACTED"
                                    ? "selected"
                                    : ""}>
                                CONTACTED
                            </option>

                            <option value="COMPLETED"
                                ${enquiry.status === "COMPLETED"
                                    ? "selected"
                                    : ""}>
                                COMPLETED
                            </option>

                        </select>

                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteEnquiry(${enquiry.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(row);

            });


            /* UPDATE DASHBOARD */

            document.getElementById("totalCount").innerText =
                data.length;

            document.getElementById("pendingCount").innerText =
                pending;

            document.getElementById("contactedCount").innerText =
                contacted;

            document.getElementById("completedCount").innerText =
                completed;

        })

        .catch(error => {

            console.error("Error:", error);

            alert("Unable to load enquiries");

        });

}


/* UPDATE STATUS */

function updateStatus(id, status) {

    fetch(
        `http://localhost:8080/api/enquiries/${id}/status?status=${status}`,
        {
            method: "PUT"
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error("Status update failed");

        }

        return response.json();

    })

    .then(data => {

        alert("Status updated successfully!");

        loadEnquiries();

    })

    .catch(error => {

        console.error("Error:", error);

        alert("Unable to update status");

    });

}


/* DELETE */

function deleteEnquiry(id) {

    if (!confirm(
        "Are you sure you want to delete this enquiry?"
    )) {

        return;

    }


    fetch(
        `http://localhost:8080/api/enquiries/${id}`,
        {
            method: "DELETE"
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error("Delete failed");

        }

        return response.text();

    })

    .then(data => {

        alert("Enquiry deleted successfully!");

        loadEnquiries();

    })

    .catch(error => {

        console.error("Error:", error);

        alert("Unable to delete enquiry");

    });

}


/* LOGOUT */

function logout() {

    document.getElementById("adminContent").style.display = "none";

    document.getElementById("loginBox").style.display = "block";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("loginError").innerText = "";

}


</script>

</body>

</html>
